name: Volar
options:
  bundleIdPrefix: tech.kioh
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
packages:
  VolarCore:
    path: ../VolarCore
  # NOTE: WhisperKit version may need bumping on Mac (from: 0.9.0 is a floor).
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: "0.9.0"
targets:
  Volar:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    # `path: Sources` is a whole-tree reference, so xcodegen recursively picks up every
    # subfolder under it (incl. Parsing/, Reminders/, Orchestrator/ added for feature 002 —
    # each ships one _Placeholder.swift so the folder is never empty) with no per-path entries
    # needed here.
    sources:
      - path: Sources
      - path: Resources
        excludes:
          - Info.plist
          - Volar.entitlements
          # Carved out into its own `sources` entry below, same way Info.plist/Volar.entitlements
          # are excluded here and wired up through their own dedicated mechanism instead
          # (INFOPLIST_FILE / `entitlements:`).
          - Assets.xcassets
      - path: Resources/Assets.xcassets
    entitlements:
      path: Resources/Volar.entitlements
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: tech.kioh.Volar
        PRODUCT_NAME: Volar
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_HARDENED_RUNTIME: YES
        # NOTE (feature 002): GENERATE_INFOPLIST_FILE stays NO — the `volar://` CFBundleURLTypes
        # registration (contracts/app-links.md) is declared directly in the physical
        # Resources/Info.plist instead of xcodegen's `target.info.properties` merge mechanism,
        # since that mechanism only applies when xcodegen itself generates the Info.plist.
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: VolarCore
        product: VolarCore
      - package: WhisperKit
        product: WhisperKit
  # UNVERIFIED (feature 002, T027): added on Windows without an Xcode/xcodegen toolchain to
  # verify against — confirm on Mac that `xcodegen generate` produces a working `VolarTests`
  # bundle target/scheme and that it actually builds & runs (`xcodebuild test`). No test target
  # existed in this file before this task.
  VolarTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      - target: Volar
      - package: VolarCore
        product: VolarCore
schemes:
  Volar:
    build:
      targets:
        Volar: all
        VolarTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - VolarTests
