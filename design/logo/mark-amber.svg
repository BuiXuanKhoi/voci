<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Volar mark, amber on ink">
  <defs>
    <radialGradient id="va-studio" cx="50%" cy="10%" r="100%">
      <stop offset="0%" stop-color="#171d26"/>
      <stop offset="58%" stop-color="#0B0D11"/>
      <stop offset="100%" stop-color="#07080B"/>
    </radialGradient>
    <radialGradient id="va-spot" cx="58%" cy="24%" r="60%">
      <stop offset="0%" stop-color="#E8B25A" stop-opacity="0.30"/>
      <stop offset="50%" stop-color="#E8B25A" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#E8B25A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="va-wing" x1="18%" y1="92%" x2="82%" y2="12%">
      <stop offset="0%" stop-color="#C68A3A"/>
      <stop offset="60%" stop-color="#E8B25A"/>
      <stop offset="100%" stop-color="#F2C982"/>
    </linearGradient>
    <filter id="va-glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="0.8"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="32" height="32" rx="7.4" fill="url(#va-studio)"/>
  <rect x="0" y="0" width="32" height="32" rx="7.4" fill="url(#va-spot)"/>
  <!-- soft bloom under the wing -->
  <g filter="url(#va-glow)" opacity="0.5">
    <path d="M6 13.2 Q9.7 19.7 13.5 21 Q17.5 17.3 22 8.3" fill="none" stroke="#E8B25A" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="24.7" cy="4.9" r="2.9" fill="#F2C982"/>
  </g>
  <!-- the wing -->
  <path d="M6 13.2 Q9.7 19.7 13.5 21 Q17.5 17.3 22 8.3" fill="none" stroke="url(#va-wing)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- the one lit thing, hottest point -->
  <circle cx="24.7" cy="4.9" r="2.15" fill="#FBE9CC"/>
  <circle cx="24.7" cy="4.9" r="2.15" fill="#F2C982" opacity="0.45"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="7.0" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>
</svg>
