name: Voci
options:
  bundleIdPrefix: app.voci
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
packages:
  VociCore:
    path: ../VociCore
  # NOTE: WhisperKit version may need bumping on Mac (from: 0.9.0 is a floor).
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: "0.9.0"
targets:
  Voci:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources
      - path: Resources
        excludes:
          - Info.plist
          - Voci.entitlements
    entitlements:
      path: Resources/Voci.entitlements
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: app.voci.Voci
        PRODUCT_NAME: Voci
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
    dependencies:
      - package: VociCore
        product: VociCore
      - package: WhisperKit
        product: WhisperKit
