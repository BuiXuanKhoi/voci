# Supabase project config for the Volar `parse` cloud-parse proxy (feature 002).
# Project: https://nuzrpipwacravfgsiacv.supabase.co
project_id = "nuzrpipwacravfgsiacv"

# The parse function does its OWN auth (StoreKit JWS in Authorization, or App Attest in
# X-Device-Token — see supabase/functions/_shared/auth.ts). It must NOT sit behind Supabase's
# gateway JWT check, so verify_jwt = false. The function itself rejects any request that carries
# neither a valid JWS nor a valid device token (fail-closed), so disabling the gateway JWT does
# not open it up — the in-function auth is the real gate.
[functions.parse]
enabled = true
verify_jwt = false

# The groq function is the paid-only Groq Speech-to-Text proxy (see supabase/functions/groq/
# README.md). Same reasoning as [functions.parse] applies: it does its own auth (StoreKit JWS in
# Authorization — verifyPaidAuth, no free/App-Attest path for this route) and fails closed on
# anything else, so it must NOT sit behind Supabase's gateway JWT check either.
[functions.groq]
enabled = true
verify_jwt = false
