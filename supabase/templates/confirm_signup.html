<!--
  Supabase Auth email template for FIRST-TIME users (GoTrue's "Confirm signup" template).

  Easy to miss: both clients call /auth/v1/otp with `create_user: true`, so a brand-new address gets
  THIS template, not "Magic Link". Editing only the Magic Link template leaves every first sign-up
  receiving a link instead of a code — the exact flow a new user hits first.

  Same {{ .Token }} requirement and same manual-paste caveat as magic_link.html.
-->
<h2>Welcome to Volar</h2>
<p>Your sign-in code:</p>
<p style="font-size: 28px; font-weight: 600; letter-spacing: 4px; margin: 16px 0;">{{ .Token }}</p>
<p>Enter it in Volar under <strong>Settings &rarr; Account</strong> to finish signing in. The code expires in 1 hour.</p>
<p style="color: #888; font-size: 12px;">If you didn't ask to sign in, you can ignore this email.</p>
